<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=call" />
  <link rel="stylesheet" href="./style.css">
  <title>Mobile Header</title>
</head>

<body class="bg-primary-color">
  <header id="mobile-header" class="container flex flex-width-full flex-wrap flex-dir-row bg-primary-color">
    <div id="mobile-logo" class="row flex flex-width-full flex-wrap">
      <div class="col flex-width-full">
        <a href="/" class="flex flex-width-full  justify-content-center align-items-center padding-s">
          <img class="logo-img" src="./images/logoipsum-364.svg" alt="logoipsum">
        </a>
      </div>


      <div id="default-button-wrap"
        class="container flex flex-width-full flex-direction-row min-height-xxxl width-full">
        <div class="col flex-col-1 min-height-s" onclick="">
          <a href="#" id="tap-to-call" class="icon-link flex flex-width-full justify-content-center align-items-center">
            <span></span>
          </a>
        </div>
        <div class="col flex-col-1 min-height-s">
          <a href="#" id="menu-toggle" class="icon-link flex flex-width-full justify-content-center align-items-center">
            <span></span>
            <!-- implement JavaScript to toggle menu -->
          </a>
        </div>
      </div>

      <!-- mobile nav -->
      <div id="mobile-nav" class="flex flex-width-full justify-content-center align-items-center">
        <nav class="flex flex-width-full flex-dir-col justify-content-right">
          <ul
            class="flex width-four-fifths flex-dir-col flex-wrap align-items-center body-font font-size-xs font-weight-bold bg-neutral-color-light">
            <li
              class="flex flex-width-full justify-content-center align-items-center inherit-color border-bottom-1px-solid-accent-tertiary-color-opacity-20">
              <a href="/"
                class="flex flex-width-full justify-content-center align-items-center padding-m inherit-color border-bottom-1px-solid-accent-tertiary-color-opacity-20">Home</a>
            </li>
            <li class=" lex flex-width-full justify-content-center align-items-center inherit-color
                border-bottom-1px-solid-accent-tertiary-color-opacity-20">
              <a href="/about"
                class="flex flex-width-full justify-content-center align-items-center padding-m inherit-color border-bottom-1px-solid-accent-tertiary-color-opacity-20">About</a>
            </li>
            <li
              class="lex flex-width-full justify-content-center align-items-center inherit-color border-bottom-1px-solid-accent-tertiary-color-opacity-20">
              <a href="/contact"
                class="flex flex-width-full justify-content-center align-items-center padding-m inherit-color border-bottom-1px-solid-accent-tertiary-color-opacity-20">Contact</a>
            </li>
            <li
              class="lex flex-width-full justify-content-center align-items-center inherit-color border-bottom-1px-solid-accent-tertiary-color-opacity-20">
              <a href="search"
                class="flex flex-width-full justify-content-center align-items-center padding-m inherit-color border-bottom-1px-solid-accent-tertiary-color-opacity-20">
                <span"><img src="./images/search-icon.png" alt="" class="width-xs height-xs"></span>
              </a>
            </li>
          </ul>
        </nav>
      </div><!-- end #nav -->

  </header>
  <script src="./mobile-header.js></script>
</body>

</html>

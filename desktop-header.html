<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"

<body>
  <header id="desktop-header"
    class="flex flex-width-full flex-nowrap flex-dir-row justify-content-center align-items-center padding-s body-font font-weight-bold accent-tertiary-color bg-primary-color">
    <div id="logo" class="col flex-col-2">
      <a href="/" class="flex flex-width-full justify-content-center align-items-center">
        <img class="logo-img" src="./images/logoipsum-364.svg" alt="logoipsum">
      </a>
    </div><!-- end #logo -->

    <div id="nav" class="flex flex-col-8 justify-content-center align-items-center">
      <nav class="flex flex-width-full flex-dir-row justify-content-center align-items-center">
        <ul
          class="flex flex-width-full flex-dir-row justify-content-center align-items-center font-size-xs accent-tertiary-color">
          <li class="flex flex-width-full flex-dir-row justify-content-center align-items-center">
            <a href="#" class="flex flex-width-full justify-content-center align-items-center inherit-color">Home</a>
          </li>
          <li class="flex flex-width-full flex-dir-row justify-content-center align-items-center">
            <a href="#" class="flex flex-width-full justify-content-center align-items-center inherit-color">About</a>
          </li>
          <li class="flex flex-width-full flex-dir-row justify-content-center align-items-center">
            <a href="#" class="flex flex-width-full justify-content-center align-items-center inherit-color">Contact</a>
          </li>
          <li class="flex flex-width-full flex-dir-row justify-content-center align-items-center">
            <a href="#" class="flex flex-width-full justify-content-center align-items-center inherit-color">
              <span"><img src="./images/search-icon.png" alt="" class="width-xs height-xs"></span>
            </a>
          </li>
        </ul>
      </nav>
    </div><!-- end #nav -->

    <div id="call" class="flex flex-col-2 justify-content-center align-items-center">
      <a href="tel:8885551212"
        class="flex flex-width-full justify-content-center align-items-center font-size-xs accent-tertiary-color">
        888-555-1212
      </a>
    </div>

  </header><!-- end #desktop-header -->
</body>

</html>
